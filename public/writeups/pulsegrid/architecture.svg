<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a443b"/>
    </marker>
  </defs>
  <rect width="560" height="390" fill="#f7f2e7"/>

  <!-- agent -->
  <rect x="190" y="18" width="180" height="58" rx="6" fill="#efe7d6" stroke="#4a443b" stroke-width="1.5"/>
  <text x="280" y="43" text-anchor="middle" font-size="17" font-weight="600" fill="#1d1a16">agent.py</text>
  <text x="280" y="64" text-anchor="middle" font-size="14" fill="#4a443b">psutil · my laptop</text>

  <line x1="280" y1="76" x2="280" y2="140" stroke="#4a443b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="292" y="104" font-size="14" fill="#a5492f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">POST /metrics</text>
  <text x="292" y="122" font-size="13" fill="#7d7466">every ~6 s</text>

  <!-- backend -->
  <rect x="190" y="142" width="180" height="66" rx="6" fill="#efe7d6" stroke="#4a443b" stroke-width="1.5"/>
  <text x="280" y="169" text-anchor="middle" font-size="17" font-weight="600" fill="#1d1a16">FastAPI</text>
  <text x="280" y="191" text-anchor="middle" font-size="14" fill="#4a443b">validate · store · alert</text>

  <!-- dashboard -->
  <rect x="12" y="148" width="124" height="54" rx="6" fill="#f7f2e7" stroke="#4a443b" stroke-width="1.5"/>
  <text x="74" y="171" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1a16">Next.js</text>
  <text x="74" y="190" text-anchor="middle" font-size="14" fill="#4a443b">dashboard</text>
  <line x1="136" y1="175" x2="188" y2="175" stroke="#4a443b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="74" y="226" text-anchor="middle" font-size="13" fill="#7d7466">polls every 5 s</text>
  <text x="74" y="244" text-anchor="middle" font-size="12" fill="#7d7466" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/metrics /agents</text>
  <text x="74" y="260" text-anchor="middle" font-size="12" fill="#7d7466" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/alerts</text>

  <!-- stores -->
  <line x1="250" y1="208" x2="190" y2="290" stroke="#4a443b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="310" y1="208" x2="390" y2="290" stroke="#4a443b" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="80" y="292" width="200" height="78" rx="6" fill="#efe7d6" stroke="#4a443b" stroke-width="1.5"/>
  <text x="180" y="318" text-anchor="middle" font-size="17" font-weight="600" fill="#1d1a16">PostgreSQL</text>
  <text x="180" y="339" text-anchor="middle" font-size="14" fill="#4a443b">metric · agent · alert</text>
  <text x="180" y="358" text-anchor="middle" font-size="13" fill="#7d7466">history, last_seen_at</text>

  <rect x="300" y="292" width="200" height="78" rx="6" fill="#efe7d6" stroke="#4a443b" stroke-width="1.5"/>
  <text x="400" y="318" text-anchor="middle" font-size="17" font-weight="600" fill="#1d1a16">Redis</text>
  <text x="400" y="339" text-anchor="middle" font-size="14" fill="#4a443b">latest reading</text>
  <text x="400" y="358" text-anchor="middle" font-size="13" fill="#7d7466">heartbeat key, 30 s TTL</text>
</svg>
