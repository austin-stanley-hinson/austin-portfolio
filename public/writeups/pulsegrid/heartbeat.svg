<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- x = 40 + t * 11 (t in seconds) -->
  <rect width="600" height="270" fill="#f7f2e7"/>

  <!-- earlier timers, cut short by the next report -->
  <rect x="40" y="58" width="66" height="14" rx="3" fill="#ddd3c0"/>
  <rect x="106" y="80" width="66" height="14" rx="3" fill="#ddd3c0"/>
  <text x="40" y="48" font-size="13" fill="#7d7466">each report resets the timer</text>

  <!-- last timer runs out -->
  <rect x="172" y="102" width="330" height="14" rx="3" fill="#a5492f" opacity="0.85"/>
  <text x="337" y="96" text-anchor="middle" font-size="13" fill="#a5492f">last heartbeat key: 30 s TTL</text>

  <!-- axis -->
  <line x1="40" y1="150" x2="580" y2="150" stroke="#4a443b" stroke-width="1.5"/>
  <g font-size="12" fill="#7d7466" text-anchor="middle">
    <line x1="40" y1="146" x2="40" y2="154" stroke="#4a443b"/><text x="40" y="170">0 s</text>
    <line x1="106" y1="146" x2="106" y2="154" stroke="#4a443b"/><text x="106" y="170">6</text>
    <line x1="172" y1="146" x2="172" y2="154" stroke="#4a443b"/><text x="172" y="170">12</text>
    <line x1="238" y1="146" x2="238" y2="154" stroke="#4a443b"/><text x="238" y="170">18</text>
    <line x1="304" y1="146" x2="304" y2="154" stroke="#4a443b"/><text x="304" y="170">24</text>
    <line x1="370" y1="146" x2="370" y2="154" stroke="#4a443b"/><text x="370" y="170">30</text>
    <line x1="436" y1="146" x2="436" y2="154" stroke="#4a443b"/><text x="436" y="170">36</text>
    <line x1="502" y1="146" x2="502" y2="154" stroke="#4a443b"/><text x="502" y="170">42</text>
    <line x1="568" y1="146" x2="568" y2="154" stroke="#4a443b"/><text x="568" y="170">48</text>
  </g>

  <!-- reports -->
  <circle cx="40" cy="150" r="6" fill="#1d1a16"/>
  <circle cx="106" cy="150" r="6" fill="#1d1a16"/>
  <circle cx="172" cy="150" r="6" fill="#1d1a16"/>
  <text x="40" y="22" font-size="14" font-weight="600" fill="#1d1a16">● report</text>

  <!-- agent stops -->
  <g stroke="#a5492f" stroke-width="2.5">
    <line x1="188" y1="142" x2="200" y2="158"/><line x1="200" y1="142" x2="188" y2="158"/>
  </g>
  <text x="194" y="196" text-anchor="middle" font-size="13" fill="#1d1a16">agent stops</text>

  <!-- expiry -->
  <line x1="502" y1="102" x2="502" y2="196" stroke="#a5492f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="502" y="212" text-anchor="middle" font-size="13" fill="#a5492f">key expires</text>
  <text x="502" y="229" text-anchor="middle" font-size="13" fill="#a5492f">→ offline</text>

  <!-- detection window -->
  <line x1="194" y1="250" x2="502" y2="250" stroke="#7d7466" stroke-width="1"/>
  <line x1="194" y1="244" x2="194" y2="256" stroke="#7d7466"/>
  <line x1="502" y1="244" x2="502" y2="256" stroke="#7d7466"/>
  <rect x="236" y="240" width="224" height="20" fill="#f7f2e7"/>
  <text x="348" y="255" text-anchor="middle" font-size="13" fill="#4a443b">24–30 s after it actually stops</text>
</svg>
